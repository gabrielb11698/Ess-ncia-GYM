<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<title>Essência Gym | Entrar</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="css/main.css">
<!--===============================================================================================-->
</head>
<body>

	<main class="login-wrap">

		<!-- Painel visual com a marca -->
		<section class="painel-marca">
			<img src="assets/logo-essencia-gym.png" alt="Logo Essência Gym">
			<div class="linha-ouro"></div>
			<p class="frase">DISCIPLINA &nbsp;•&nbsp; CONSTÂNCIA &nbsp;•&nbsp; RESULTADOS</p>
		</section>

		<!-- Painel do formulário -->
		<section class="painel-form">
			<form class="form-login" novalidate>
				<h1 class="titulo-form">Bem-vindo de volta</h1>
				<p class="subtitulo-form">Entre com sua conta para continuar seus treinos.</p>

				<div class="campo" data-tipo="email">
					<label for="email">E-mail</label>
					<input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
					<span class="mensagem-erro">Informe um e-mail válido, ex: nome@exemplo.com</span>
				</div>

				<div class="campo" data-tipo="senha">
					<label for="senha">Senha</label>
					<input id="senha" type="password" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
					<button type="button" class="icone botao-olho" aria-label="Mostrar senha">Mostrar</button>
					<span class="mensagem-erro">Digite sua senha para continuar</span>
				</div>

				<div class="linha-opcoes">
					<label class="lembrar">
						<input type="checkbox" name="lembrar">
						Lembrar de mim
					</label>
					<a class="link-recuperar" href="recuperar-senha.html">Esqueceu a senha?</a>
				</div>

				<button type="submit" class="botao-entrar">Entrar</button>

				<p class="rodape-form">
					Ainda não tem uma conta?
					<a href="cadastro.html">Cadastre-se</a>
				</p>
			</form>
		</section>

	</main>

<!--===============================================================================================-->
	<script src="js/main.js"></script>
</body>
</html>

})(jQuery);
